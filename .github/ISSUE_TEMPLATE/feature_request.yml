name: Feature Request
description: Suggest an idea or new component for shadcn-compose
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature or component!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is (e.g., "I'm always frustrated when...").

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what component, parameter, or behavior you want added.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Reference
      description: Link to real shadcn/ui component documentation or design reference (if applicable).
